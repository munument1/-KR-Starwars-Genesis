name: Audit Genesis images

on:
  schedule:
    - cron: "37 2 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_images.py"
      - ".github/workflows/audit-images.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare upstream and Korean guide images
        run: python3 scripts/audit_images.py
